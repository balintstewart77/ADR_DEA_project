  save_and_return_later_enabled: true
  return_without_separate_return_code_enabled: true
  completed_response_modification_enabled: false
  automatically_continue_to_next_survey_enabled: false
  redirect_url: ''
  participant_repeat_the_survey_enabled: false
  security_note: Possession of the personalised link permits access to an unfinished
    review; participants must not forward it, and direct contact identifiers are absent
    from the REDCap response project.
stop_actions_manual_after_import:
  intended_recipient: 'No'
  owner_consent: 'No'
  offline_equivalent: Downstream consent content is branched on affirmative answers;
    queue logic suppresses Project Review.
  minimum_external_disposition: No automatic deletion, retention, reminder-suppression
    or contact-table action is encoded or claimed; follow the separately approved
    recruitment-administration process.
  invalid_affirmative: No unverified action tag is encoded. Live QA must establish
    that an attempted Yes with any item blank or Not confirmed is not treated as valid
    consent and reveals no Project Review.
