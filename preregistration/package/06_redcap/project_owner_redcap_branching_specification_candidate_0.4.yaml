proposed_slot_visibility:
  domain_and_purpose_question: Is the basis for this classification visible in the
    public project title and datasets listed above?
  tag_question: Is the basis for this tag status visible in the public project title
    and datasets listed above?
  choices:
    '2': Clearly visible
    '1': Partly visible
    '0': Not visible
    '3': Unsure
  explanation_required_when:
    domain_or_purpose_verdict:
    - '2: Does not fit'
    tag_correctness:
    - '0: No'
  optional_visibility_explanation_shown_when:
  - '1: Partly visible'
  - '0: Not visible'
  - '3: Unsure'
  unsure_correctness_explanation_displayed: false
tag_reviews:
  always_review_both: true
  canonical_order:
  - Demographic disparities / equity tag
  - COVID-19 & Pandemic
  fields:
    t01:
      proposed_status: prop_t01_status
      correctness: po_t01_correct
      correctness_explanation: po_t01_correct_explain
      visibility: po_t01_vis
      visibility_explanation: po_t01_vis_explain
      label: Demographic disparities / equity tag
      definition: A cross-cutting tag for projects whose research question centres
        on comparing outcomes, experiences, risks, access, or trajectories across
        demographic or equality-relevant groups. Routine subgroup breakdowns do not
        qualify, and socioeconomic or deprivation-based inequality alone is insufficient
        unless comparison across demographic or equality-relevant groups is central.
      definition_field: prop_t01_def
      display_field: po_t01_display
    t02:
      proposed_status: prop_t02_status
      correctness: po_t02_correct
      correctness_explanation: po_t02_correct_explain
      visibility: po_t02_vis
      visibility_explanation: po_t02_vis_explain
      label: COVID-19 & Pandemic
      definition: A cross-cutting tag for projects where COVID-19, the COVID-19 pandemic,
        pandemic conditions, infection surveillance, vaccination, lockdowns, social
        distancing, pandemic-related public support, or pandemic consequences are
        a central condition or lens for the research question. Research does not qualify
        merely because its data cover the pandemic period or because COVID-19 is mentioned
        incidentally.
      definition_field: prop_t02_def
      display_field: po_t02_display
  missing_tag_summary_role: Summary cross-check after the two primary per-tag proposed-status
    assessments; retained for later protocol and participant-document alignment.
  operational_inclusion_rule: include_in_prompt is true; layer is Cross-cutting tag;
    source status does not begin 'removed'
  operational_set:
  - Demographic disparities / equity tag
  - COVID-19 & Pandemic
  lifecycle_statuses:
    Demographic disparities / equity tag: new v3.4
    COVID-19 & Pandemic: active
  lifecycle_status_is_not_operational_inclusion: true
  definitions:
    Demographic disparities / equity tag: A cross-cutting tag for projects whose research
      question centres on comparing outcomes, experiences, risks, access, or trajectories
      across demographic or equality-relevant groups. Routine subgroup breakdowns
      do not qualify, and socioeconomic or deprivation-based inequality alone is insufficient
      unless comparison across demographic or equality-relevant groups is central.
    COVID-19 & Pandemic: A cross-cutting tag for projects where COVID-19, the COVID-19
      pandemic, pandemic conditions, infection surveillance, vaccination, lockdowns,
      social distancing, pandemic-related public support, or pandemic consequences
      are a central condition or lens for the research question. Research does not
      qualify merely because its data cover the pandemic period or because COVID-19
      is mentioned incidentally.
  proposed_display_short_definitions:
    Demographic disparities / equity tag: Comparisons across demographic or equality-relevant
      groups are central; socioeconomic inequality alone or routine subgroup breakdowns
      do not qualify.
    COVID-19 & Pandemic: COVID-19 or pandemic conditions are a central research focus
      or lens, not merely the period covered by the data.
  rc3_short_definition_immediately_before_status: true
  independent_required_judgements: true
missing_label_branching:
  gateways_required: true
  gateway_position: after each checkbox and optional basis field
  checkbox_menus_unconditional: true
  checkbox_menus_required: false
  purpose_guidance_field: po_miss_purpose_guidance
  purpose_max_checked_annotation: '@MAXCHECKED=2'
  contradictory_state_rule: 'pending: checkbox selections with a final No or Unsure
    radio response must be flagged and handled under an approved analysis rule'
analytical_completion:
  owner_join:
  - intended_recipient = 1
  - consent_items_complete = 1
  - owner_consent = 1
  - owner_consent_complete = 2
  domains_and_purposes: verdict and visibility for every populated slot, plus correctness
    explanation only for Does not fit
  tags: correctness and visibility for both tags, plus correctness explanation only
    for No
  missing_labels: all three required post-list identification radios; checkbox selections
    are optional raw responses and contradictory radio/checkbox states require a separately
    approved analysis rule
  overall: public-entry sufficiency, project-knowledge gateway and taxonomy fit, plus
    taxonomy issue for Partial Fit/No Fit
  excluded_optional_fields:
  - ack_pref
  - po_d01_vis_explain
  - po_d02_vis_explain
  - po_d03_vis_explain
  - po_d04_vis_explain
  - po_p01_vis_explain
  - po_p02_vis_explain
  - po_t01_vis_explain
  - po_t02_vis_explain
  - po_miss_domain_basis
  - po_miss_purpose_basis
  - po_miss_tag_basis
  - po_suff_explain
  - po_nonpublic_note
  - po_tax_explain
  - po_other_comment
  excluded_display_support_fields:
  - prop_domain_summary
  - prop_purpose_summary
  - prop_tag_summary
  - po_classification_overview
  submitted_is_separate: project_review_complete = 2 is submission status, not the
    analytical-completion definition
  final_branching_state_rule: Derive completion and analysis variables from final
    parent responses. Preserve raw exported values, but ignore any retained value
    whose field is hidden under the final branching state.
  optional_text_missingness: Blank optional prose means not provided; it does not
    mean no issue, no missing information, no taxonomy problem or no reliance on project
    knowledge. Structured responses are primary outcomes.
  qualitative_reporting: Report the number of comments contributing to each qualitative
    theme or quotation; do not interpret optional-comment themes as prevalence estimates.
  quotation_policy: Quotation permission is not collected in REDCap. If the study
    team wishes to use a participant’s words, the participant will be contacted by
    email with the exact proposed quotation and the context in which it would appear.
    The quotation will be used only following written agreement.
