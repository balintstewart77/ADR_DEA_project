  quotation_permission: absent; agreement is requested by email only at point of use
  classification_orientation_field: po_intro
  classification_orientation_paragraphs:
  - How the classifications work
  - Research Domains describe what the project is about. Several may apply, and they
    are not ranked.
  - Analytical Purposes describe what the project is trying to do analytically. One
    or two may apply.
  - A Research Domain or Analytical Purpose should be treated as applying only when
    it is a substantive focus of the project’s research question or analytical aims—not
    merely because related terms, datasets, variables, methods or outcomes are mentioned
    or used.
  - Cross-cutting tags show whether Demographic disparities / equity or COVID-19 &
    Pandemic is a central feature of the research question. Either, both or neither
    may apply.
  - Each proposed classification is shown with a definition. Please judge each one
    independently against the actual project and then assess whether its basis is
    visible in the public register entry.
  classification_orientation_order: project information -> po_intro -> po_classification_overview
    -> detailed judgements
  substantive_focus_rule:
