  introduction_html: <strong>Project Owner Review</strong><br>Please begin by completing
    <strong>Participant Information and Consent</strong> below. If you agree to take
    part, your available project reviews will then appear in this list. You may complete
    all, some or none, in any order. To pause an unfinished review, use <strong>Save
    & Return Later</strong> before leaving. You can return using the same personalised
    link. Please do not forward this link.
  owner_consent:
    active: true
    condition: '[owner_id] <> '''''
    auto_start: true
  project_review:
    active: true
    condition: '[owner_consent_complete] = ''2'' and [owner_consent] = ''1'' and [intended_recipient]
