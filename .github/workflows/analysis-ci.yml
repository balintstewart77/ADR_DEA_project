# Continuous integration for the analysis test suite, so test failures surface
# on code changes instead of only in the weekly register refresh.
#
# Tests only: this workflow never runs the refresh pipeline, LLM classification
# or pull request creation.
#
# Pull requests are filtered to code and the files that drive it. The weekly
# register refresh opens a data-only pull request as github-actions[bot], and
# GitHub holds workflow runs on bot-opened pull requests at "action required"
# until a maintainer approves them, which left a check that never completed.
# Refreshed data is still tested twice: by the refresh job before it opens the
# pull request, and by the push trigger below once that pull request lands.

name: Analysis CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/**"
      - "taxonomy_data_dictionary.yaml"
      - "analysis/register_reference.yaml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Full history: the analysis tests verify figure provenance with
      # `git show <pinned commit>:<path>`, which fails on a shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dashboard.txt
            requirements-scrape.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dashboard.txt -r requirements-scrape.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest analysis -q
