# Continuous integration for the analysis test suite, so test failures surface
# on code changes instead of only in the weekly register refresh.
#
# Tests only: this workflow never runs the refresh pipeline, LLM classification
# or pull request creation.

name: Analysis CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Full history: the analysis tests verify figure provenance with
      # `git show <pinned commit>:<path>`, which fails on a shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Check Python correctness
        run: python -m ruff check dashboard analysis scrape scripts tests conftest.py

      - name: Run test suite
        run: python -m pytest analysis tests -q -ra -m "not browser" --require-history

      - name: Verify tests leave tracked files unchanged
        run: git diff --exit-code

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements.lock
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest tests/test_enriched_register_alignment_browser.py -q --require-browser
      - name: Verify browser tests leave tracked files unchanged
        run: git diff --exit-code
